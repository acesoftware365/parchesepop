<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b2d68" />
    <title>Parchís Pop</title>
    <meta
      name="description"
      content="Juega Parchís Pop con tus amigos en una sala privada o pública."
    />
    <style>
      :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        color: #fff; background:
          radial-gradient(circle at 15% 15%, #2474e5 0 10%, transparent 35%),
          radial-gradient(circle at 85% 85%, #7257e9 0 10%, transparent 38%),
          linear-gradient(145deg, #071b40, #0b2d68 55%, #3a2d84);
        padding: 24px;
      }
      main {
        width: min(460px, 100%); text-align: center; padding: 36px 28px;
        border: 2px solid rgb(255 255 255 / .34); border-radius: 32px;
        background: rgb(7 27 64 / .82); box-shadow: 0 24px 60px rgb(0 0 0 / .34);
      }
      .mark {
        width: 82px; height: 82px; display: grid; place-items: center;
        margin: 0 auto 18px; border-radius: 24px; background: #ffc83d;
        color: #17284d; font-size: 44px; border: 4px solid #fff;
        transform: rotate(-4deg); box-shadow: 0 10px 24px rgb(0 0 0 / .28);
      }
      h1 { margin: 0; font-size: clamp(38px, 10vw, 58px); line-height: .84; letter-spacing: -2px; }
      p { margin: 20px auto 0; max-width: 34ch; color: #e7eeff; line-height: 1.5; font-weight: 700; }
      .chips { display: flex; justify-content: center; gap: 10px; margin-top: 26px; }
      .chip { width: 42px; height: 42px; border-radius: 50%; border: 3px solid #fff; }
      .red { background: #f04452; } .blue { background: #2474e5; }
      .yellow { background: #ffc83d; } .green { background: #32b875; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">⚄</div>
      <h1>PARCHÍS<br />POP!</h1>
      <p>Abre una invitación de sala desde tu mensaje para jugar con tus amigos.</p>
      <div class="chips" aria-hidden="true">
        <span class="chip red"></span><span class="chip blue"></span>
        <span class="chip yellow"></span><span class="chip green"></span>
      </div>
    </main>
  </body>
</html>
